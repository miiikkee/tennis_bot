<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>tennis-finder 预览</title>
<style>
  body{ font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC",Arial;
        margin:0; background:#eef1f3; color:#1f2a37; }
  .bar{ background:#1f2a37; color:#fff; padding:14px 22px; font-size:15px; font-weight:700; }
  main{ max-width:1200px; margin:18px auto; padding:0 16px; }
  .note{ color:#6b7785; font-size:13px; margin:0 0 12px; }
</style>
</head>
<body>
  <div class="bar">示例：你的网站外壳（与组件样式互不影响）</div>
  <main>
    <p class="note">下方灰框内即嵌入的 &lt;tennis-finder&gt; 组件实时预览。</p>
    <tennis-finder src="public_data.json" poll="300"></tennis-finder>
  </main>
  <!-- 每次加载都带时间戳，强制取最新组件，避免浏览器缓存旧版 -->
  <script>
    var s = document.createElement('script');
    s.src = 'tennis-finder.js?t=' + Date.now();
    document.head.appendChild(s);
  </script>
</body>
</html>
