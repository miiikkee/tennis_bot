<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎾 NYC Tennis Finder</title>
<style>
  body{ margin:0; background:#f7f8f7;
        font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC",Arial; }
  @media (prefers-color-scheme: dark){ body{ background:#0f1210 } }
  main{ max-width:1200px; margin:0 auto; padding:10px 12px 40px; }
</style>
</head>
<body>
  <main>
    <!-- 免登录数据来自 GitHub Actions 云端每小时刷新；登录场馆数据来自运营方 Mac 推送 -->
    <tennis-finder src="public_data.json" login-src="login_data.json" poll="600"></tennis-finder>
  </main>
  <!-- 带时间戳强制取最新组件，避免浏览器缓存旧版 -->
  <script>
    var s = document.createElement('script');
    s.src = 'tennis-finder.js?t=' + Date.now();
    document.head.appendChild(s);
  </script>
</body>
</html>
